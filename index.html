<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/x-icon"
      href="/src/assets/img/toys-favicon.png"
    />
    <title>BarOS</title>
    <script>
      // Runs before the stylesheet paints, so a light-set device never flashes
      // dark first. Deliberately duplicates a little of theme.service.js: by the
      // time a module could load, the wrong theme has already been seen.
      (function () {
        try {
          var c = localStorage.getItem('baros_theme')
          if (c === 'light' || c === 'dark') document.documentElement.setAttribute('data-theme', c)
        } catch (e) { /* storage refused; fall through to the device setting */ }
        var light = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches
        var resolved = document.documentElement.getAttribute('data-theme') || (light ? 'light' : 'dark')
        document.documentElement.style.colorScheme = resolved
      })()
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
